# Auditoría de base de datos en producción (SOLO LECTURA)
#
# Qué hace: ejecuta el verificador que ya existe (`npm run db:check`) contra el
# proyecto real, con `--redact` para que ningún identificador personal llegue al
# registro de Actions. No escribe en Firestore, no despliega, no migra, no
# inicializa nada y no toca IAM ni la autenticación.
#
# Esto es un control de PROCESO, no un despliegue: aunque el job referencia un
# entorno, no publica nada ni ejecuta artefactos.
#
# ---------------------------------------------------------------------------
# REQUISITOS EXTERNOS — deben existir ANTES de la primera ejecución.
# Este fichero NO los crea y ninguna prueba local demuestra que existan:
#
#   1. Entorno `production-audit` (Settings → Environments) con:
#        - Required reviewers: al menos una persona.
#        - «Allow administrators to bypass configured protection rules»: DESMARCADO.
#        - Deployment branches: solo `main`.
#      Si el entorno NO existe, GitHub lo crea al vuelo la primera vez SIN
#      ninguna regla de protección: la aprobación desaparecería sin aviso.
#
#   2. Dos secretos DEL ENTORNO `production-audit` (nunca del repositorio, que
#      es público), con nombres EXCLUSIVOS de la auditoría para que no puedan
#      heredarse de un secreto de repositorio con el mismo nombre:
#        DB_AUDIT_FIREBASE_CLIENT_EMAIL → correo de la cuenta de servicio de
#                                         solo lectura (roles/datastore.viewer)
#        DB_AUDIT_FIREBASE_PRIVATE_KEY  → su clave privada (con \n escapados)
#      El workflow los mapea a `FIREBASE_CLIENT_EMAIL` / `FIREBASE_PRIVATE_KEY`
#      solo dentro del paso de auditoría.
#
#   3. Rama `main` protegida (recomendado), para que nadie pueda introducir un
#      cambio en el verificador sin revisión.
#
# Disparo: manual, sin parámetros, y solo desde `main`.
# ---------------------------------------------------------------------------
name: DB audit (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Auditoría de solo lectura
    # Único ref admitido: main. Cualquier otra rama no ejecuta el trabajo.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-audit
    env:
      # Fijados aquí a propósito: la auditoría no acepta proyecto ni comandos
      # como parámetros de entrada.
      FIREBASE_PROJECT_ID: formacionus-63555
      DB_ALLOW_PROD: "yes"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Auditar (solo lectura, con redacción)
        id: audit
        # Las credenciales viven en el ENTORNO `production-audit` y solo se
        # exponen a este paso, no a la instalación ni al resto del trabajo.
        # Nunca se imprimen: el verificador solo dice que faltan si no llegan.
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.DB_AUDIT_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.DB_AUDIT_FIREBASE_PRIVATE_KEY }}
        # Sin `continue-on-error`: si el verificador falla, el trabajo falla. El
        # estado técnico se decide por los códigos de la salida, no por el
        # código de salida del proceso (NO_ADMIN también sale con 1).
        run: |
          set +e
          OUTPUT=$(npm run db:check -- --redact 2>&1)
          CODE=$?
          set -e

          # La salida ya viene redactada por el verificador (stdout y stderr:
          # el propio verificador filtra también lo que escribe el SDK). Se
          # imprime tal cual y NO se guarda como artefacto.
          printf '%s\n' "$OUTPUT"

          # El verificador sanea los saltos de línea, así que un dato
          # manipulado no puede fabricar líneas. Aun así, se toma la ÚLTIMA
          # coincidencia (la que imprime el verificador al final) y se valida
          # con la forma exacta esperada; cualquier otra cosa se descarta.
          STATUS_LINE=$(printf '%s\n' "$OUTPUT" | grep -E '^AUDITORÍA: ' | tail -n 1 || true)
          SUMMARY_LINE=$(printf '%s\n' "$OUTPUT" | grep -E '^Resumen: ' | tail -n 1 || true)

          STATUS_PATTERN='^AUDITORÍA: (AUDIT_BLOCKED|NO_ADMIN|ADMIN_COUNT [0-9]+) · ESQUEMA: (OK|AUSENTE|INCOMPATIBLE|NO COMPROBABLE) · ÍNDICES: (OK|FALTAN|NO COMPROBABLE)$'
          SUMMARY_PATTERN='^Resumen: [0-9]+ error\(es\), [0-9]+ aviso\(s\), [0-9]+ informativo\(s\)\.$'

          # `grep` valida línea a línea: un valor con varias líneas pasaría si
          # UNA de ellas encajara. Se rechaza cualquier valor multilínea.
          case "$STATUS_LINE" in *$'\n'*) STATUS_LINE="" ;; esac
          case "$SUMMARY_LINE" in *$'\n'*) SUMMARY_LINE="" ;; esac

          if ! printf '%s' "$STATUS_LINE" | grep -qE "$STATUS_PATTERN"; then
            STATUS_LINE="AUDITORÍA: AUDIT_BLOCKED · ESQUEMA: NO COMPROBABLE · ÍNDICES: NO COMPROBABLE"
          fi
          if ! printf '%s' "$SUMMARY_LINE" | grep -qE "$SUMMARY_PATTERN"; then
            SUMMARY_LINE=""
          fi

          {
            echo "status=$STATUS_LINE"
            echo "summary=$SUMMARY_LINE"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"

          exit "$CODE"

      - name: Resumen del trabajo
        if: always()
        env:
          STATUS: ${{ steps.audit.outputs.status }}
          SUMMARY: ${{ steps.audit.outputs.summary }}
          CODE: ${{ steps.audit.outputs.code }}
        run: |
          STATUS_PATTERN='^AUDITORÍA: (AUDIT_BLOCKED|NO_ADMIN|ADMIN_COUNT [0-9]+) · ESQUEMA: (OK|AUSENTE|INCOMPATIBLE|NO COMPROBABLE) · ÍNDICES: (OK|FALTAN|NO COMPROBABLE)$'
          SUMMARY_PATTERN='^Resumen: [0-9]+ error\(es\), [0-9]+ aviso\(s\), [0-9]+ informativo\(s\)\.$'

          STATUS="${STATUS:-}"
          SUMMARY="${SUMMARY:-}"

          # Un valor multilínea no puede colarse en el resumen aunque una de
          # sus líneas encaje con el patrón.
          case "$STATUS" in *$'\n'*) STATUS="" ;; esac
          case "$SUMMARY" in *$'\n'*) SUMMARY="" ;; esac

          if ! printf '%s' "$STATUS" | grep -qE "$STATUS_PATTERN"; then
            STATUS="AUDITORÍA: AUDIT_BLOCKED · ESQUEMA: NO COMPROBABLE · ÍNDICES: NO COMPROBABLE"
          fi

          {
            echo "## Auditoría de la base de datos (solo lectura)"
            echo
            echo "- \`$STATUS\`"
            if printf '%s' "$SUMMARY" | grep -qE "$SUMMARY_PATTERN"; then
              echo "- \`$SUMMARY\`"
            fi
            if printf '%s' "$STATUS" | grep -q 'AUDIT_BLOCKED'; then
              # Un fallo de instalación, credenciales, conexión o ejecución no
              # dice nada sobre los datos: nunca se informa como NO_ADMIN.
              echo "- Ejecución no completada o interrumpida: estado técnico **AUDIT_BLOCKED**."
            elif [ -z "${CODE:-}" ]; then
              echo "- Ejecución no completada: estado técnico **AUDIT_BLOCKED**."
            else
              echo "- Código de salida del verificador: \`$CODE\` (0 sin errores, 1 con hallazgos \`error\`)."
            fi
            echo
            echo "Sin despliegues, escrituras, migraciones ni artefactos. Los identificadores personales se redactan en el verificador antes de imprimir."
          } >> "$GITHUB_STEP_SUMMARY"
